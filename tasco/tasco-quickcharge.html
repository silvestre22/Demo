<title>Tasco QuickCharge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f6f3ee; --surface:#ffffff; --surface-tint:#fbeded;
    --ink:#1c1a17; --ink-soft:#6b6357; --line:#e8e1d6;
    --red:#d81e2c; --red-dark:#a61220; --red-soft:#fbe4e3;
    --green:#1e8e5a; --green-soft:#e1f3e9;
    --amber:#9c6a15; --amber-soft:#fbeeda;
    --wa:#25d366; --wa-soft:#e3f9ec;
    --tng:#00629b; --tng-soft:#e3f0f8; --tng-accent:#f7941d;
    --shadow-1:0 1px 2px rgba(28,26,23,.08); --shadow-2:0 14px 34px rgba(28,26,23,.14);
    --radius-s:10px; --radius-m:16px; --radius-l:24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141210; --surface:#1e1b18; --surface-tint:#2a1a19;
      --ink:#f3efe8; --ink-soft:#b6aca0; --line:#33302a;
      --red:#ff5a63; --red-dark:#ff8288; --red-soft:#3b1a1b;
      --green:#3fcb8e; --green-soft:#123526; --amber:#e4ac52; --amber-soft:#3a2a10;
      --wa-soft:#0f2b1c; --tng-soft:#0f2433;
      --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 14px 34px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141210; --surface:#1e1b18; --surface-tint:#2a1a19;
    --ink:#f3efe8; --ink-soft:#b6aca0; --line:#33302a;
    --red:#ff5a63; --red-dark:#ff8288; --red-soft:#3b1a1b;
    --green:#3fcb8e; --green-soft:#123526; --amber:#e4ac52; --amber-soft:#3a2a10;
    --wa-soft:#0f2b1c; --tng-soft:#0f2433;
    --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 14px 34px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Public Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  h1,h2,h3{ font-family:'Archivo',sans-serif; font-weight:800; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  p{ margin:0; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  .app{ width:100%; max-width:460px; min-height:100%; background:var(--surface); display:flex; flex-direction:column; position:relative; }
  @media (min-width:540px){
    body{ padding-block:24px; }
    .app{ max-width:460px; box-shadow:var(--shadow-2); border-radius:var(--radius-l); overflow:hidden; min-height:calc(100% - 48px); }
  }

  .topbar{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .topbar img{ height:20px; }
  .topbar-charger{ margin-left:auto; text-align:right; }
  .topbar-charger-name{ font-size:12.5px; font-weight:700; }
  .topbar-charger-site{ font-size:11px; color:var(--ink-soft); }

  .content{ flex:1; padding:22px 20px 32px; display:flex; flex-direction:column; gap:18px; }
  .step-eyebrow{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); }
  .step-title{ font-size:22px; }
  .step-sub{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; }

  .btn{ font-size:15px; font-weight:700; padding:13px 18px; border-radius:999px; border:1.5px solid transparent; cursor:pointer; transition:transform .1s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-block{ width:100%; }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-wa{ background:var(--wa); color:#fff; display:flex; align-items:center; justify-content:center; gap:9px; }
  .btn-tng{ background:var(--tng); color:#fff; display:flex; align-items:center; justify-content:center; gap:9px; }
  .btn-link{ background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; padding:4px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .field input{
    font:inherit; font-size:16px; padding:12px 14px; border-radius:var(--radius-s);
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); width:100%;
  }
  .field input:focus{ border-color:var(--red); }
  .field-error{ font-size:12.5px; color:var(--red); min-height:15px; }
  .field-hint{ font-size:12px; color:var(--ink-soft); }

  .otp-row{ display:flex; gap:8px; justify-content:space-between; }
  .otp-row input{ width:44px; height:52px; text-align:center; font-size:22px; padding:0; }

  .charger-card{ display:flex; gap:14px; align-items:center; background:var(--surface-tint); border:1px solid var(--red-soft); border-radius:var(--radius-m); padding:16px; }
  .charger-icon{ width:44px; height:44px; border-radius:12px; background:var(--red); display:flex; align-items:center; justify-content:center; flex:none; }
  .charger-icon svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .charger-name{ font-weight:700; font-size:15px; }
  .charger-site{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .charger-meta{ display:flex; gap:12px; margin-top:6px; font-size:11.5px; color:var(--ink-soft); }
  .charger-meta b{ color:var(--ink); font-weight:700; }

  .kv-row{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:9px 0; border-bottom:1px solid var(--line); }
  .kv-row:last-of-type{ border-bottom:none; }
  .kv-label{ color:var(--ink-soft); }
  .kv-val{ font-weight:600; }
  .kv-total{ font-size:16px; font-weight:800; }

  .badge-wa{ background:var(--wa-soft); color:var(--wa); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .badge-tng{ background:var(--tng-soft); color:var(--tng); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }

  .gauge-wrap{ position:relative; width:170px; height:170px; margin:4px auto; }
  .gauge-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .gauge-track{ fill:none; stroke:var(--line); stroke-width:12; }
  .gauge-fill{ fill:none; stroke:var(--green); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .9s linear; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-power{ font-size:28px; font-weight:600; line-height:1; }
  .gauge-power-unit{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .active-stats{ display:flex; gap:10px; }
  .active-stat{ flex:1; background:var(--surface-tint); border-radius:var(--radius-s); padding:10px; text-align:center; }
  .active-stat-val{ font-size:16px; font-weight:700; }
  .active-stat-label{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }

  .spinner{ width:36px; height:36px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--red); animation:spin .8s linear infinite; margin:8px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner.tng{ border-top-color:var(--tng); }

  .settle-banner{ display:flex; align-items:center; gap:12px; border-radius:var(--radius-m); padding:16px; }
  .settle-banner.refund{ background:var(--green-soft); }
  .settle-banner.charge{ background:var(--amber-soft); }
  .settle-banner.exact{ background:var(--surface-tint); }
  .settle-icon{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .settle-banner.refund .settle-icon{ background:var(--green); }
  .settle-banner.charge .settle-icon{ background:var(--amber); }
  .settle-banner.exact .settle-icon{ background:var(--ink-soft); }
  .settle-icon svg{ width:19px; height:19px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .settle-title{ font-weight:700; font-size:14.5px; }
  .settle-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .receipt-check{ width:56px; height:56px; border-radius:50%; background:var(--green-soft); display:flex; align-items:center; justify-content:center; margin:6px auto; }
  .receipt-check svg{ width:28px; height:28px; stroke:var(--green); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,18,16,.5); display:flex; align-items:flex-end; justify-content:center; z-index:30; }
  @media (min-width:540px){ .modal-backdrop{ align-items:center; } }
  .tng-sheet{ width:100%; max-width:440px; background:var(--surface); border-radius:var(--radius-l) var(--radius-l) 0 0; padding:0; overflow:hidden; }
  @media (min-width:540px){ .tng-sheet{ border-radius:var(--radius-l); } }
  .tng-header{ background:var(--tng); color:#fff; padding:20px 22px; display:flex; align-items:center; gap:12px; }
  .tng-header svg{ width:26px; height:26px; }
  .tng-header-title{ font-weight:800; font-size:15px; }
  .tng-header-sub{ font-size:11.5px; opacity:.85; }
  .tng-body{ padding:24px 22px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  .tng-amount{ font-size:32px; font-weight:800; }
  .tng-note{ font-size:12.5px; color:var(--ink-soft); }
  .tng-actions{ width:100%; display:flex; flex-direction:column; gap:10px; padding:0 22px 22px; }

  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--surface); font-size:13px; font-weight:600; padding:11px 18px; border-radius:999px; box-shadow:var(--shadow-2); max-width:88%; text-align:center; }

  .footer-link{ text-align:center; padding-top:6px; }

  /* ---------- Admin ---------- */
  .admin-shell{ width:100%; min-height:100vh; display:none; background:var(--bg); color:var(--ink); }
  .admin-shell.show{ display:flex; }
  .admin-login-screen{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:32px 24px; background:radial-gradient(120% 90% at 50% -10%, rgba(216,30,44,.16) 0%, transparent 55%), #17140f; }
  .admin-login-wrap{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:8px; }
  .admin-login-wrap img{ height:30px; margin-bottom:10px; filter:brightness(0) invert(1); }
  .admin-login-kicker{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#ff5a63; }
  .admin-login-title{ font-size:24px; color:#fff; margin-top:4px; }
  .admin-login-wrap .field-label{ color:#b6aca0; }
  .admin-login-wrap input{ background:#201c19; border-color:#33302a; color:#f3efe8; }
  .admin-login-form{ display:flex; flex-direction:column; gap:14px; margin-top:12px; }

  .admin-sidebar{ flex:none; width:230px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh; }
  .admin-brand{ display:flex; align-items:center; gap:10px; padding:6px 12px 24px; }
  .admin-brand img{ height:20px; }
  .admin-brand-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  .admin-nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .admin-navitem{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:var(--radius-s); color:var(--ink-soft); font-size:14px; font-weight:600; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
  .admin-navitem svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .admin-navitem:hover{ background:var(--bg); color:var(--ink); }
  .admin-navitem.active{ background:var(--red-soft); color:var(--red); }
  .admin-signout{ margin-top:8px; width:100%; background:none; border:1.5px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .admin-signout:hover{ border-color:var(--red); color:var(--red); }
  .admin-main{ flex:1; min-width:0; }
  .admin-content{ padding:30px 34px 60px; max-width:1200px; }
  .page-title{ font-size:23px; }
  .page-subtitle{ color:var(--ink-soft); font-size:13px; margin-top:4px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; }
  .kpi-val{ font-size:23px; font-weight:700; }
  .kpi-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .table-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; margin-bottom:22px; }
  .table-scroll{ overflow-x:auto; }
  .data-table{ width:100%; border-collapse:collapse; min-width:680px; }
  .data-table th{ text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:11px 16px; background:var(--bg); border-bottom:1px solid var(--line); white-space:nowrap; }
  .data-table td{ padding:12px 16px; font-size:13px; border-bottom:1px solid var(--line); }
  .data-table tbody tr:last-child td{ border-bottom:none; }
  .data-table tbody tr:hover{ background:var(--surface-tint); }
  .pill{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill-refund{ background:var(--green-soft); color:var(--green); }
  .pill-charge{ background:var(--amber-soft); color:var(--amber); }
  .pill-exact{ background:var(--line); color:var(--ink-soft); }
  .toolbar-filters{ display:flex; gap:8px; margin-bottom:14px; }
  .chip{ font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .chip.active{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

  .settings-card{ max-width:420px; }
  .settings-card .field{ margin-bottom:16px; }
  .settings-note{ font-size:12px; color:var(--ink-soft); line-height:1.5; background:var(--surface-tint); padding:10px 12px; border-radius:var(--radius-s); margin-top:4px; }

  .chart-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .chart-head span{ font-size:11px; color:var(--ink-soft); }
  .usage-chart{ display:flex; align-items:flex-end; gap:10px; height:120px; }
  .usage-bar{ flex:1; background:var(--red); border-radius:4px 4px 0 0; opacity:.85; }
  .usage-bar:last-child{ opacity:1; }
  .chart-labels{ display:flex; gap:10px; margin-top:8px; }
  .chart-labels span{ flex:1; text-align:center; font-size:10px; color:var(--ink-soft); }

  .menu-btn{ background:none; border:1.5px solid var(--line); border-radius:var(--radius-s); width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
  .admin-topbar{ display:none; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center; }
  .sidebar-scrim{ position:fixed; inset:0; background:rgba(20,18,16,.4); z-index:35; }

  @media (max-width:860px){
    .admin-sidebar{ position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-2); }
    .admin-sidebar.open{ transform:translateX(0); }
    .admin-main{ display:flex; flex-direction:column; width:100%; }
    .admin-topbar{ display:flex; }
    .admin-content{ padding:20px 18px 48px; }
  }
  @media (min-width:861px){ .admin-shell{ } .menu-btn{ display:none; } }

  [hidden]{ display:none !important; }
</style>

  function startSession(){
    pub.session = { elapsed:0, energy:0, power:charger.maxPowerKW*0.9 };
    goStep('charging');
    tickSession();
    pub.timer = setInterval(tickSession, 1000);
  }
  function tickSession(){
    var s = pub.session;
    if(s.elapsed > 0){
      var wobble = Math.sin(s.elapsed/9)*charger.maxPowerKW*0.05 + (Math.random()-0.5)*charger.maxPowerKW*0.03;
      s.power = Math.max(charger.maxPowerKW*0.55, Math.min(charger.maxPowerKW, charger.maxPowerKW*0.9 + wobble));
      s.energy += s.power/3600;
    }
    s.elapsed += 1;
    updateChargingDom();
  }
  function updateChargingDom(){
    var s = pub.session;
    var frac = s.power / charger.maxPowerKW;
    var circ = 439.8;
    var fillEl = $('#gauge-fill');
    if(fillEl) fillEl.setAttribute('stroke-dashoffset', (circ*(1-frac)).toFixed(1));
    var pw = $('#stat-power'); if(pw) pw.textContent = s.power.toFixed(1);
    var m = Math.floor(s.elapsed/60), sec = s.elapsed%60;
    var elEl = $('#stat-elapsed'); if(elEl) elEl.textContent = (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
    var enEl = $('#stat-energy'); if(enEl) enEl.textContent = s.energy.toFixed(1)+' kWh';
    var costEl = $('#stat-cost'); if(costEl) costEl.textContent = 'RM'+fmt2(s.energy*config.rate);
  }

  function renderSettle(){

    var bill = energy * config.rate;

    pub.lastBill = { energy:energy, bill:bill, diff:diff };
    var kind = diff > 0.005 ? 'refund' : (diff < -0.005 ? 'charge' : 'exact');
    var icon = kind==='refund' ? '<svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6"/></svg>' :
               kind==='charge' ? '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' :
               '<svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6"/></svg>';
    var title = kind==='refund' ? 'Refunding RM'+fmt2(diff)+' to your eWallet' :
                kind==='charge' ? 'Collecting RM'+fmt2(-diff)+' more from your eWallet' :
                'Deposit exactly covers your bill';
    var sub = kind==='refund' ? 'Your bill was lower than the deposit — the difference is on its way back.' :
              kind==='charge' ? 'Your bill was a little higher than the deposit — just the shortfall is collected.' :
              'No further charge or refund needed.';

    $('#public-content').innerHTML =
      '<div class="step-eyebrow">Step 4 of 4 &middot; Settlement</div>' +
      '<h1 class="step-title">Session complete</h1>' +

      '</div>' +
      '<div class="settle-banner '+kind+'"><div class="settle-icon">'+icon+'</div><div><div class="settle-title">'+title+'</div><div class="settle-sub">'+sub+'</div></div></div>' +
      '<button class="btn btn-tng btn-block" id="btn-settle">'+tngLogoSmall()+(kind==='charge' ? 'Authorise via TNG eWallet' : 'Continue')+'</button>';

    $('#btn-settle').addEventListener('click', function(){
      if(kind === 'exact'){ goStep('receipt'); return; }
      openTngSheet('settle', diff, function(){ goStep('receipt'); });

    var rows = history.filter(function(h){
      if(historyFilter==='all') return true;
      if(historyFilter==='today') return h.start.slice(0,10)==='2026-09-21';
      return true;
    }).map(function(h){
      var m = settlementMeta(h);
      return '<tr><td>'+h.phone+'</td><td>'+h.charger+'</td><td>'+h.start+'</td><td>'+h.duration+'</td>' +
        '<td>'+h.energy.toFixed(1)+' kWh</td><td>RM'+fmt2(h.bill)+'</td><td>RM'+fmt2(h.deposit)+'</td>' +
        '<td><span class="pill '+m.pill+'">'+m.label+'</span></td></tr>';
    }).join('');
    $('#admin-outlet').innerHTML =
      '<div class="page-head"><div><h1 class="page-title">Charging History</h1><p class="page-subtitle">Every public and employee walk-up session.</p></div></div>' +
      '<div class="toolbar-filters">' +
        '<button class="chip'+(historyFilter==='all'?' active':'')+'" id="hf-all">All</button>' +
        '<button class="chip'+(historyFilter==='today'?' active':'')+'" id="hf-today">Today</button>' +
      '</div>' +
      '<div class="table-card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Phone</th><th>Charger</th><th>Started</th><th>Duration</th><th>Energy</th><th>Bill</th><th>Deposit</th><th>Settlement</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div></div>';
    $('#hf-all').addEventListener('click', function(){ historyFilter='all'; renderAdminHistory(); });
    $('#hf-today').addEventListener('click', function(){ historyFilter='today'; renderAdminHistory(); });
  }

  function renderAdminSettings(){
    $('#admin-outlet').innerHTML =
      '<div class="page-head"><div><h1 class="page-title">Price Settings</h1><p class="page-subtitle">Changes apply to sessions started after saving — in-progress sessions keep their original rate.</p></div></div>' +
      '<div class="table-card settings-card" style="padding:22px">' +
        '<label class="field"><span class="field-label">Rate (RM per kWh)</span><input id="set-rate" type="number" step="0.01" min="0" value="'+config.rate.toFixed(2)+'"></label>' +
        '<label class="field"><span class="field-label">Refundable deposit (RM)</span><input id="set-deposit" type="number" step="0.01" min="0" value="'+config.deposit.toFixed(2)+'"></label>' +
        '<div class="settings-note">Bills are always calculated as <b>energy (kWh) &times; rate</b>, settled against the deposit — refunding the difference or collecting the shortfall automatically via the driver’s TNG eWallet.</div>' +
        '<button class="btn btn-primary" id="btn-save-settings" style="margin-top:16px">Save changes</button>' +
      '</div>';
    $('#btn-save-settings').addEventListener('click', function(){
      var r = parseFloat($('#set-rate').value), d = parseFloat($('#set-deposit').value);
      if(!(r>0) || !(d>0)){ showToast('Enter valid amounts.'); return; }
      config.rate = r; config.deposit = d;
      showToast('Pricing updated.');
    });
  }

})();
</script>
